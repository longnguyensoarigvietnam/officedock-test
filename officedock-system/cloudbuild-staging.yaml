steps:
  # Get ENV from SecretManager and write to .env
  - id: 'Write ENV'
    name: gcr.io/cloud-builders/gcloud
    entrypoint: 'bash'
    secretEnv: ['_SYSTEM_ENV']
    args: ['-c', 'echo "$$_SYSTEM_ENV" > officedock-system/.env']

  # Build Docker Image on Cloud Build
  - id: 'Build Docker Image'
    name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    secretEnv: ['_SYSTEM_ARTIFACT_REGISTORY_PATH']
    args:
      [
        '-c',
        'docker build --platform linux/amd64 -t $$_SYSTEM_ARTIFACT_REGISTORY_PATH:$COMMIT_SHA -f Dockerfile.staging .',
      ]
    dir: 'officedock-system'

  # Push built Docker Image on Artifact Registry
  - id: 'Push Docker Image'
    name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    secretEnv: ['_SYSTEM_ARTIFACT_REGISTORY_PATH']
    args: ['-c', 'docker push $$_SYSTEM_ARTIFACT_REGISTORY_PATH:$COMMIT_SHA']

  # Deploy built Docker Image on Cloud Run
  - id: 'Deploy Docker Image'
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    secretEnv:
      [
        '_SYSTEM_ARTIFACT_REGISTORY_PATH',
        '_SYSTEM_REGION',
        '_SYSTEM_SERVICE_NAME',
      ]
    args: [
        '-c',
        "gcloud run deploy $$_SYSTEM_SERVICE_NAME \
        --image $$_SYSTEM_ARTIFACT_REGISTORY_PATH:$COMMIT_SHA \
        --region $$_SYSTEM_REGION \
        --port 3000 \
        --allow-unauthenticated",
      ]

options:
  logging: CLOUD_LOGGING_ONLY

# Settings SecretManager
availableSecrets:
  secretManager:
    - versionName: projects/${PROJECT_NUMBER}/secrets/STG_SYSTEM_ARTIFACT_REGISTRY_PATH/versions/latest
      env: _SYSTEM_ARTIFACT_REGISTORY_PATH
    - versionName: projects/${PROJECT_NUMBER}/secrets/STG_SYSTEM_REGION/versions/latest
      env: _SYSTEM_REGION
    - versionName: projects/${PROJECT_NUMBER}/secrets/STG_SYSTEM_SERVICE_NAME/versions/latest
      env: _SYSTEM_SERVICE_NAME
    - versionName: projects/${PROJECT_NUMBER}/secrets/STG_SYSTEM_ENV/versions/latest
      env: _SYSTEM_ENV
