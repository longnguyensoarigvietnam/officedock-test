version: '3.10'

services:
  api:
    build: .
    image: officedock-api
    container_name: api
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/code
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_DB=officedock
      - POSTGRES_USER=officedock
      - POSTGRES_PASSWORD=officedock
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
    depends_on:
      - db

  db:
    image: postgres:12
    container_name: db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=officedock
      - POSTGRES_USER=officedock
      - POSTGRES_PASSWORD=officedock
    volumes:
      - postgres_data:/var/lib/postgresql/data/

volumes:
  postgres_data:
