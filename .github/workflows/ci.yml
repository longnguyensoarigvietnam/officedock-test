name: Dependency Security Audit

on:
  pull_request:
    paths:
      - 'officedock-admin/package.json'
      - 'officedock-admin/package-lock.json'
      - 'officedock-system/package.json'
      - 'officedock-system/package-lock.json'

permissions:
  contents: read

jobs:
  security-audit:
    name: NPM Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4.1.0
        with:
          node-version: '22'

      - name: Upgrade npm to v11.10.0+
        run: npm install -g npm@11.10.0

      - name: Audit officedock-admin
        working-directory: ./officedock-admin
        run: |
          npm ci --ignore-scripts --allow-git=none
          npm audit --audit-level=high
          npm audit signatures

      - name: Audit officedock-system
        working-directory: ./officedock-system
        run: |
          npm ci --ignore-scripts --allow-git=none
          npm audit --audit-level=high
          npm audit signatures
